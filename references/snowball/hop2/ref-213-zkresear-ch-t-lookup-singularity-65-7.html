uot;name\\\&quot;:\\\&quot;简体中文\\\&quot;,\\\&quot;value\\\&quot;:\\\&quot;zh_CN\\\&quot;},{\\\&quot;name\\\&quot;:\\\&quot;繁體中文\\\&quot;,\\\&quot;value\\\&quot;:\\\&quot;zh_TW\\\&quot;}]\&quot;,\&quot;require_invite_code\&quot;:false,\&quot;site_logo_url\&quot;:\&quot;https://zkresear.ch/uploads/default/original/1X/9378ad55aa514fd61b0b84d4907d4585105cebda.png\&quot;,\&quot;site_logo_small_url\&quot;:\&quot;\&quot;,\&quot;site_mobile_logo_url\&quot;:\&quot;https://zkresear.ch/uploads/default/original/1X/9378ad55aa514fd61b0b84d4907d4585105cebda.png\&quot;,\&quot;site_favicon_url\&quot;:\&quot;https://zkresear.ch/uploads/default/optimized/1X/_129430568242d1b7f853bb13ebea28b3f6af4e7_2_32x32.png\&quot;,\&quot;site_logo_dark_url\&quot;:\&quot;\&quot;,\&quot;site_logo_small_dark_url\&quot;:\&quot;\&quot;,\&quot;site_mobile_logo_dark_url\&quot;:\&quot;\&quot;}&quot;,&quot;customHTML&quot;:&quot;{\&quot;top\&quot;:\&quot;\&quot;,\&quot;footer\&quot;:\&quot;\&quot;}&quot;,&quot;banner&quot;:&quot;{}&quot;,&quot;customEmoji&quot;:&quot;[]&quot;,&quot;isReadOnly&quot;:&quot;false&quot;,&quot;isStaffWritesOnly&quot;:&quot;false&quot;,&quot;activatedThemes&quot;:&quot;{\&quot;1\&quot;:\&quot;Default\&quot;}&quot;,&quot;topic_65&quot;:&quot;{\&quot;post_stream\&quot;:{\&quot;posts\&quot;:[{\&quot;id\&quot;:91,\&quot;name\&quot;:\&quot;Barry\&quot;,\&quot;username\&quot;:\&quot;barryWhiteHat\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/zkresear.ch/barrywhitehat/{size}/63_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-11-23T22:46:54.867Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThanks \\u003ca href=\\\&quot;https://github.com/ChihChengLiang\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eCC\\u003c/a\\u003e for review and feedback \\u003cimg src=\\\&quot;https://zkresear.ch/images/emoji/twitter/slight_smile.png?v=12\\\&quot; title=\\\&quot;:slight_smile:\\\&quot; class=\\\&quot;emoji\\\&quot; alt=\\\&quot;:slight_smile:\\\&quot; loading=\\\&quot;lazy\\\&quot; width=\\\&quot;20\\\&quot; height=\\\&quot;20\\\&quot;\\u003e\\u003c/p\\u003e\\n\\u003ch2\\u003e\\n\\u003ca name=\\\&quot;intro-1\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#intro-1\\\&quot;\\u003e\\u003c/a\\u003eIntro\\u003c/h2\\u003e\\n\\u003cp\\u003eFor years the central component of ZKPs was \\u003cspan class=\\\&quot;math\\\&quot;\\u003eA* B + D == C\\u003c/span\\u003e. This check was applied repeatedly to build our full circuits. Any computation can be represented in this way. This representation is called R1CS.\\u003c/p\\u003e\\n\\u003cp\\u003eIt turns out R1CS is prohibitively expensive for certain tasks. This led to increased use of lookup arguments. Currently we use lookups and a variant of R1CS called polynomial constraints to build our circuits.\\u003c/p\\u003e\\n\\u003cp\\u003eA lot of things are blocked if we want to build them using only r1cs. So the general flow is that some clever people get together and find efficient ways to arithmetise circuits. They create hand tuned circuits that include both polynomial constraints and lookup arguments. This is circuit specific and is not very scalable.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\n\\u003ca name=\\\&quot;polynomial-constraints-2\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#polynomial-constraints-2\\\&quot;\\u003e\\u003c/a\\u003ePolynomial constraints\\u003c/h2\\u003e\\n\\u003cp\\u003ePolynomial constraints are complicated. The circuit implementer makes many of these polynomial equations. The whole circuit is defined as a system of polynomial equations.\\u003cbr\\u003e\\nA solution to this system of equations makes a valid proof. It’s hard to reason about the results of systems of equations.\\u003cbr\\u003e\\nFormal verification tools cannot , at the moment, solve polynomial equations in a prime field.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\n\\u003ca name=\\\&quot;lookup-arguments-3\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#lookup-arguments-3\\\&quot;\\u003e\\u003c/a\\u003eLookup arguments\\u003c/h2\\u003e\\n\\u003cp\\u003eLookup arguments are set membership checks. They were first used to do efficient big integer arithmetic. Now used for that but also as control flow for VMs and to do operations that are not snark friendly. They are not more efficient for all operations. The cost per lookup introduces some prover cost. We currently try and use lookup arguments rarely because they are expensive in the prover\\u003c/p\\u003e\\n\\u003ch2\\u003e\\n\\u003ca name=\\\&quot;why-lookup-arguments-are-good-4\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#why-lookup-arguments-are-good-4\\\&quot;\\u003e\\u003c/a\\u003eWhy lookup arguments are good\\u003c/h2\\u003e\\n\\u003ch3\\u003e\\n\\u003ca name=\\\&quot;language-5\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#language-5\\\&quot;\\u003e\\u003c/a\\u003eLanguage\\u003c/h3\\u003e\\n\\u003cp\\u003eCurrently snark friendly languages are very difficult for new programmers to learn. They use prime fields and polynomial constraints which are not a paradigm they are used to.  A language that only uses lookup arguments could be much simpler. Current languages are good at doing computation that is specific to snarks but doing traditional computation is much more expensive. A lookup only language would be better on both counts.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\n\\u003ca name=\\\&quot;security-review-6\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#security-review-6\\\&quot;\\u003e\\u003c/a\\u003eSecurity review\\u003c/h3\\u003e\\n\\u003cp\\u003eAuditors are not used to finding solutions to a series of polynomial equations. Lookup arguments are much simpler to reason about.\\u003c/p\\u003e\\n\\u003ch4\\u003e\\n\\u003ca name=\\\&quot;example-7\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#example-7\\\&quot;\\u003e\\u003c/a\\u003eExample:\\u003c/h4\\u003e\\n\\u003cp\\u003eTake a circuit is an AND of two input variables, the output is the result.\\u003c/p\\u003e\\n\\u003ch5\\u003e\\n\\u003ca name=\\\&quot;lookup-approach-8\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#lookup-approach-8\\\&quot;\\u003e\\u003c/a\\u003eLookup approach\\u003c/h5\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003eout = get x,y from AND table\\nreturn(out)\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eThe above lookup approach is much simpler than the polynomial approach shown next.\\u003c/p\\u003e\\n\\u003ch5\\u003e\\n\\u003ca name=\\\&quot;polynomial-approach-9\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#polynomial-approach-9\\\&quot;\\u003e\\u003c/a\\u003epolynomial approach\\u003c/h5\\u003e\\n\\u003cpre\\u003e\\u003ccode class=\\\&quot;lang-auto\\\&quot;\\u003e(x)(x-1) = 0 \\ny(y-1) = 0 \\nx*y = out\\nreturn(out)\\n\\u003c/code\\u003e\\u003c/pre\\u003e\\n\\u003cp\\u003eIt is likely going to be much simpler to find bugs in lookup only circuits.\\u003c/p\\u003e\\n\\u003ch3\\u003e\\n\\u003ca name=\\\&quot;formal-verification-10\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#formal-verification-10\\\&quot;\\u003e\\u003c/a\\u003eFormal verification\\u003c/h3\\u003e\\n\\u003cp\\u003eFormal verification tools need to solve the series of polynomial equations. Tools that solve these systems do not work well over prime fields. This leads to a lot of extra work being required to make a solver that works over a field. Using only lookup arguments would allow us to use already existing tools. It would also open up other methods for us to explore. Lookup arguments limit the set of valid variables at any point in the circuit. So we go from the set of possible variables being \\u003cspan class=\\\&quot;math\\\&quot;\\u003e2^{254}\\u003c/span\\u003e to being \\u003cspan class=\\\&quot;math\\\&quot;\\u003e2\\u003c/span\\u003e or \\u003cspan class=\\\&quot;math\\\&quot;\\u003e2^{16}\\u003c/span\\u003e. This could even allow us to do things like state space enumeration to confirm our circuit is correct.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\n\\u003ca name=\\\&quot;information-theory-comparison-11\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#information-theory-comparison-11\\\&quot;\\u003e\\u003c/a\\u003eInformation theory comparison\\u003c/h2\\u003e\\n\\u003cp\\u003eIn order to effectively describe our program as a circuit we need to make a circuit that maps an input to the correct output. We can look at circuits as information encoded per second of prover time. This seems like a good way to compare the different ways we have of implementing circuits.\\u003c/p\\u003e\\n\\u003cp\\u003ePolynomial constraints have limited degree. This is because the degree affects the prover time. The degree limits the information you can encode with them. You can make a polynomial that is degree 5 that can map 5 input values to 5 output values. You can’t include more values in the polynomial unless you increase the degree. In many cases this is fine because we use the structure of the polynomial constraint to do calculations. So multiplication is defined by a polynomial operation \\u003cspan class=\\\&quot;math\\\&quot;\\u003eA * B == C\\u003c/span\\u003e but XOR is not and needs to be encoded as keys to values.\\u003c/p\\u003e\\n\\u003cp\\u003eLookup arguments can contain much more information. We have previously been limited in table size of \\u003cspan class=\\\&quot;math\\\&quot;\\u003e2^{28}\\u003c/span\\u003e elements. But recent work makes the limit of circuit size the maximum trusted setup you can feasibly complete.  This limit on the \\u003cspan class=\\\&quot;math\\\&quot;\\u003etable\\\\_size\\u003c/span\\u003e. \\u003ca href=\\\&quot;https://eprint.iacr.org/2022/1565\\\&quot; class=\\\&quot;inline-onebox\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eBaloo: Nearly Optimal Lookup Arguments\\u003c/a\\u003e. A single polynomial constraint can contain ~ \\u003cspan class=\\\&quot;math\\\&quot;\\u003e5 *2^{254}\\u003c/span\\u003e  bits of information. Lookup arguments can contain \\u003cspan class=\\\&quot;math\\\&quot;\\u003e2^{254} * table\\\\_size\\u003c/span\\u003e bits of information.\\u003c/p\\u003e\\n\\u003cp\\u003ePolynomial constraints are very useful where you use the structure of the polynomial constraint. But as tables of bigger size become feasible this advantage will disappear.\\u003c/p\\u003e\\n\\u003ch2\\u003e\\n\\u003ca name=\\\&quot;conclusions-12\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#conclusions-12\\\&quot;\\u003e\\u003c/a\\u003eConclusions\\u003c/h2\\u003e\\n\\u003cp\\u003eIf we can efficiently define circuits using lookup arguments only it will lead to simpler tooling and circuits.\\u003c/p\\u003e\\n\\u003cp\\u003eLookup arguments will become more efficient than polynomial constraints for almost everything with time.\\u003c/p\\u003e\\n\\u003cp\\u003eWe should start building the tooling for a lookup centric zkps\\u003c/p\\u003e\\n\\u003ch2\\u003e\\n\\u003ca name=\\\&quot;future-work-13\\\&quot; class=\\\&quot;anchor\\\&quot; href=\\\&quot;#future-work-13\\\&quot;\\u003e\\u003c/a\\u003eFuture work\\u003c/h2\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eCompare efficiency of circuits right now.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eExample lookup only language\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eDo a comparison of relative efficiency of various lookup arguments. Try and estimate the pace of improvements\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eFind examples where lookup arguments are better and worse than polynomial constraints\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003eFind the worst case examples for both\\u003c/li\\u003e\\n\\u003cli\\u003eBenchmark many circuits using: lookup arguments, lookup + polynomial constraints and compare them for efficiency\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\&quot;,\&quot;post_number\&quot;:1,\&quot;post_type\&quot;:1,\&quot;updated_at\&quot;:\&quot;2022-11-23T22:47:12.335Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:2535,\&quot;reads\&quot;:71,\&quot;readers_count\&quot;:70,\&quot;score\&quot;:12934.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:65,\&quot;topic_slug\&quot;:\&quot;lookup-singularity\&quot;,\&quot;display_username\&quot;:\&quot;Barry\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://github.com/ChihChengLiang\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;ChihChengLiang (Chih Cheng Liang) · GitHub\&quot;,\&quot;clicks\&quot;:67},{\&quot;url\&quot;:\&quot;https://eprint.iacr.org/2022/1565\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;Baloo: Nearly Optimal Lookup Arguments\&quot;,\&quot;clicks\&quot;:44}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:13}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:37,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false},{\&quot;id\&quot;:99,\&quot;name\&quot;:\&quot;\&quot;,\&quot;username\&quot;:\&quot;nibnalin\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/zkresear.ch/nibnalin/{size}/14_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-11-24T12:12:57.652Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eGreat post, thanks for sharing! Another interesting idea of similar flavor is to consider recursion protocols as a primitive for cheap structured operations. In particular, with folding scheme based constructions like \\u003ca href=\\\&quot;https://github.com/microsoft/Nova\\\&quot; rel=\\\&quot;noopener nofollow ugc\\\&quot;\\u003eNova\\u003c/a\\u003e (that work directly on the level of constraint IOPs), we could witness repeated operations and prove them within a larger SNARK seperately.\\u003c/p\\u003e\\n\\u003cp\\u003eFor instance, building on your example, suppose we have a large circuit with N AND operations mapping two M bit inputs to one M bit output. Then, we could first extract these N operations from the witness and seperately write a recursive circuit of N steps (verifying one M bit AND op at each step) in Nova, and generate as output a Nova (relaxed R1CS) instance with O(M) constraints + O(1) recursion overhead constraints (~10k or so in case of Nova). Therefore, the prover would do O(N) work outside the main proof (notably the dominating cost is from O(N) MSMs) + O(1) extra checks in their primary circuit, matching the optimal lookup table arguments runtime.\\u003c/p\\u003e\\n\\u003cp\\u003eIn this setup, we don’t exactly get all the described benefits of security/simplicity lookups have, but it’s not bounded on trusted setup size (as yet?) and efficient implementations of folding schemes like Nova already exist. It would be interesting to try comparing these ideas and benchmarking concrete numbers!\\u003c/p\\u003e\\n\\u003cp\\u003e\\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/therealyingtong\\\&quot;\\u003e@therealyingtong\\u003c/a\\u003e also noted that similar approaches are used in the ZK EVM circuits (for hashing, for instance)\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:2,\&quot;post_type\&quot;:1,\&quot;updated_at\&quot;:\&quot;2022-11-24T12:18:18.931Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:15,\&quot;reads\&quot;:56,\&quot;readers_count\&quot;:55,\&quot;score\&quot;:236.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:65,\&quot;topic_slug\&quot;:\&quot;lookup-singularity\&quot;,\&quot;display_username\&quot;:\&quot;\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://github.com/microsoft/Nova\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;GitHub - microsoft/Nova: Nova: Recursive SNARKs without trusted setup\&quot;,\&quot;clicks\&quot;:6}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:8}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:true,\&quot;staff\&quot;:true,\&quot;user_id\&quot;:7,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false},{\&quot;id\&quot;:102,\&quot;name\&quot;:\&quot;Shumo Chu\&quot;,\&quot;username\&quot;:\&quot;shumo\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/zkresear.ch/shumo/{size}/47_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-11-24T19:03:40.848Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003e\\u003cdiv class=\\\&quot;lightbox-wrapper\\\&quot;\\u003e\\u003ca class=\\\&quot;lightbox\\\&quot; href=\\\&quot;https://zkresear.ch/uploads/default/original/1X/6c65464f7fa98cdb7008cd05050c4b6be051347f.png\\\&quot; data-download-href=\\\&quot;https://zkresear.ch/uploads/default/6c65464f7fa98cdb7008cd05050c4b6be051347f\\\&quot; title=\\\&quot;Screenshot 2022-11-24 at 1.59.55 PM\\\&quot;\\u003e\\u003cimg src=\\\&quot;https://zkresear.ch/uploads/default/optimized/1X/6c65464f7fa98cdb7008cd05050c4b6be051347f_2_690x337.png\\\&quot; alt=\\\&quot;Screenshot 2022-11-24 at 1.59.55 PM\\\&quot; data-base62-sha1=\\\&quot;fsUxTH1AqVUHzyMxc3MxLWRSLBJ\\\&quot; width=\\\&quot;690\\\&quot; height=\\\&quot;337\\\&quot; srcset=\\\&quot;https://zkresear.ch/uploads/default/optimized/1X/6c65464f7fa98cdb7008cd05050c4b6be051347f_2_690x337.png, https://zkresear.ch/uploads/default/optimized/1X/6c65464f7fa98cdb7008cd05050c4b6be051347f_2_1035x505.png 1.5x, https://zkresear.ch/uploads/default/original/1X/6c65464f7fa98cdb7008cd05050c4b6be051347f.png 2x\\\&quot; data-dominant-color=\\\&quot;19191A\\\&quot;\\u003e\\u003cdiv class=\\\&quot;meta\\\&quot;\\u003e\\n\\u003csvg class=\\\&quot;fa d-icon d-icon-far-image svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#far-image\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\u003cspan class=\\\&quot;filename\\\&quot;\\u003eScreenshot 2022-11-24 at 1.59.55 PM\\u003c/span\\u003e\\u003cspan class=\\\&quot;informations\\\&quot;\\u003e1186×580 98.7 KB\\u003c/span\\u003e\\u003csvg class=\\\&quot;fa d-icon d-icon-discourse-expand svg-icon\\\&quot; aria-hidden=\\\&quot;true\\\&quot;\\u003e\\u003cuse href=\\\&quot;#discourse-expand\\\&quot;\\u003e\\u003c/use\\u003e\\u003c/svg\\u003e\\n\\u003c/div\\u003e\\u003c/a\\u003e\\u003c/div\\u003e\\u003c/p\\u003e\\n\\u003cp\\u003eAs Ariel nicely articulated above, I think a hybrid approach makes a lot of sense. One of my biggest pain point of writing Circom today is having to using things like this (don’t know how to call this, Groth16 arithmetization?) as a “poor man’s” lookup table:\\u003c/p\\u003e\\n\\u003caside class=\\\&quot;onebox githubblob\\\&quot; data-onebox-src=\\\&quot;https://github.com/iden3/circomlib/blob/master/circuits/mux4.circom\\ u003e\\n\\n  \\u003cdiv style=\\\&quot;clear: both\\\&quot;\\u003e\\u003c/div\\u003e\\n\\u003c/aside\\u003e\\n\&quot;,\&quot;post_number\&quot;:3,\&quot;post_type\&quot;:1,\&quot;updated_at\&quot;:\&quot;2022-11-24T19:03:40.848Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:null,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:13,\&quot;reads\&quot;:49,\&quot;readers_count\&quot;:48,\&quot;score\&quot;:139.8,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:65,\&quot;topic_slug\&quot;:\&quot;lookup-singularity\&quot;,\&quot;display_username\&quot;:\&quot;Shumo Chu\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;link_counts\&quot;:[{\&quot;url\&quot;:\&quot;https://github.com/iden3/circomlib/blob/master/circuits/mux4.circom\&quot;,\&quot;internal\&quot;:false,\&quot;reflection\&quot;:false,\&quot;title\&quot;:\&quot;circomlib/mux4.circom at master · iden3/circomlib · GitHub\&quot;,\&quot;clicks\&quot;:54},{\&quot;url\&quot;:\&quot;https://zkresear.ch/uploads/default/original/1X/6c65464f7fa98cdb7008cd05050c4b6be051347f.png\&quot;,\&quot;internal\&quot;:true,\&quot;reflection\&quot;:false,\&quot;clicks\&quot;:0}],\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:2}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:29,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false},{\&quot;id\&quot;:106,\&quot;name\&quot;:\&quot;Barry\&quot;,\&quot;username\&quot;:\&quot;barryWhiteHat\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/zkresear.ch/barrywhitehat/{size}/63_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-11-25T22:26:43.368Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI think Ariel is assuming you can’t make a table iwth more than 2**128 elements I think if we can do that then we can do better than native adds and muls especially if you are doing wrong field stuff.\\u003c/p\\u003e\\n\\u003cp\\u003eI agree that we need to be able to make very big tables.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:4,\&quot;post_type\&quot;:1,\&quot;updated_at\&quot;:\&quot;2022-11-25T22:26:43.368Z\&quot;,\&quot;reply_count\&quot;:1,\&quot;reply_to_post_number\&quot;:3,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:5,\&quot;reads\&quot;:43,\&quot;readers_count\&quot;:42,\&quot;score\&quot;:128.6,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:65,\&quot;topic_slug\&quot;:\&quot;lookup-singularity\&quot;,\&quot;display_username\&quot;:\&quot;Barry\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;username\&quot;:\&quot;shumo\&quot;,\&quot;name\&quot;:\&quot;Shumo Chu\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/zkresear.ch/shumo/{size}/47_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:4}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:37,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false},{\&quot;id\&quot;:114,\&quot;name\&quot;:\&quot;Shumo Chu\&quot;,\&quot;username\&quot;:\&quot;shumo\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/zkresear.ch/shumo/{size}/47_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-11-28T19:26:53.855Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eThe prover work of newer constructions like Baloo is quasi-linear to size\\u003cbr\\u003e\\nof the set to be opened (rather than the entire table), which is very nice. However, these works still require a linear or quasi-linear setup time with regards to the actual size of the lookup table. Do you think this is an inherent limitation? If so, would that imply making a 2^128 sized lookup table would still be quite prohibitive? (I don’t know what is the real practical size to be, but I would guess something like 2^60 ish).\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:5,\&quot;post_type\&quot;:1,\&quot;updated_at\&quot;:\&quot;2022-11-28T20:39:38.203Z\&quot;,\&quot;reply_count\&quot;:2,\&quot;reply_to_post_number\&quot;:4,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:9,\&quot;reads\&quot;:41,\&quot;readers_count\&quot;:40,\&quot;score\&quot;:78.2,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:65,\&quot;topic_slug\&quot;:\&quot;lookup-singularity\&quot;,\&quot;display_username\&quot;:\&quot;Shumo Chu\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;version\&quot;:2,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;username\&quot;:\&quot;barryWhiteHat\&quot;,\&quot;name\&quot;:\&quot;Barry\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/zkresear.ch/barrywhitehat/{size}/63_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:1}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:29,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false},{\&quot;id\&quot;:115,\&quot;name\&quot;:\&quot;Carlos Pérez\&quot;,\&quot;username\&quot;:\&quot;CPerezz\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/zkresear.ch/cperezz/{size}/71_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-11-29T23:05:07.778Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eI guess then that with schemes like Baloo, we could get slightly closer the lookup-singularity by increasing the ratio bits/lookup with slightly better pre-processing times and, for sure, much better proving times. But not sure if it gives enough positive expectations for the lookup singularity future. Let me elaborate:\\u003c/p\\u003e\\n\\u003cp\\u003eTheoretically, with 4 columns of 2^64 elements each, we should be able to express any 2^256 element. This means that we need 8 columns to represent 2 2^256-elements and 12 columns to represent any operation between them that gives as a result another 2^256 element.\\u003c/p\\u003e\\n\\u003cp\\u003eThis will look like:\\u003c/p\\u003e\\n\\u003cdiv class=\\\&quot;md-table\\\&quot;\\u003e\\n\\u003ctable\\u003e\\n\\u003cthead\\u003e\\n\\u003ctr\\u003e\\n\\u003cth\\u003eE64\\u003c/th\\u003e\\n\\u003cth\\u003eE128\\u003c/th\\u003e\\n\\u003cth\\u003eE192\\u003c/th\\u003e\\n\\u003cth\\u003eE256\\u003c/th\\u003e\\n\\u003cth\\u003eF64\\u003c/th\\u003e\\n\\u003cth\\u003eF128\\u003c/th\\u003e\\n\\u003cth\\u003eF192\\u003c/th\\u003e\\n\\u003cth\\u003eF256\\u003c/th\\u003e\\n\\u003cth\\u003eR64\\u003c/th\\u003e\\n\\u003cth\\u003eR128\\u003c/th\\u003e\\n\\u003cth\\u003eR192\\u003c/th\\u003e\\n\\u003cth\\u003eR256\\u003c/th\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/thead\\u003e\\n\\u003ctbody\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003eX1\\u003c/td\\u003e\\n\\u003ctd\\u003eX2\\u003c/td\\u003e\\n\\u003ctd\\u003eX3\\u003c/td\\u003e\\n\\u003ctd\\u003eX4\\u003c/td\\u003e\\n\\u003ctd\\u003eY1\\u003c/td\\u003e\\n\\u003ctd\\u003eY2\\u003c/td\\u003e\\n\\u003ctd\\u003eY3\\u003c/td\\u003e\\n\\u003ctd\\u003eY4\\u003c/td\\u003e\\n\\u003ctd\\u003eZ1\\u003c/td\\u003e\\n\\u003ctd\\u003eZ2\\u003c/td\\u003e\\n\\u003ctd\\u003eZ3\\u003c/td\\u003e\\n\\u003ctd\\u003eZ4\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e…\\u003c/td\\u003e\\n\\u003ctd\\u003e…\\u003c/td\\u003e\\n\\u003ctd\\u003e…\\u003c/td\\u003e\\n\\u003ctd\\u003e…\\u003c/td\\u003e\\n\\u003ctd\\u003e…\\u003c/td\\u003e\\n\\u003ctd\\u003e…\\u003c/td\\u003e\\n\\u003ctd\\u003e…\\u003c/td\\u003e\\n\\u003ctd\\u003e…\\u003c/td\\u003e\\n\\u003ctd\\u003e…\\u003c/td\\u003e\\n\\u003ctd\\u003e…\\u003c/td\\u003e\\n\\u003ctd\\u003e…\\u003c/td\\u003e\\n\\u003ctd\\u003e…\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003eXN_1\\u003c/td\\u003e\\n\\u003ctd\\u003eXN_2\\u003c/td\\u003e\\n\\u003ctd\\u003eXN_3\\u003c/td\\u003e\\n\\u003ctd\\u003eXN_4\\u003c/td\\u003e\\n\\u003ctd\\u003eYN_1\\u003c/td\\u003e\\n\\u003ctd\\u003eYN_2\\u003c/td\\u003e\\n\\u003ctd\\u003eYN_3\\u003c/td\\u003e\\n\\u003ctd\\u003eYN_4\\u003c/td\\u003e\\n\\u003ctd\\u003eZN_1\\u003c/td\\u003e\\n\\u003ctd\\u003eZN_2\\u003c/td\\u003e\\n\\u003ctd\\u003eZN_3\\u003c/td\\u003e\\n\\u003ctd\\u003eZN_4\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/tbody\\u003e\\n\\u003c/table\\u003e\\n\\u003c/div\\u003e\\u003cp\\u003eAssuming this, we see that the ratio with tables of 2^64 bit elements for an addition, mul, XOR or any \\u003ccode\\u003eF(x,y)-\\u0026gt;z\\u003c/code\\u003e is of \\u003cstrong\\u003e12columns/256bit-num operation\\u003c/strong\\u003e. So according to \\u003ca class=\\\&quot;mention\\\&quot; href=\\\&quot;/u/shumo\\\&quot;\\u003e@shumo\\u003c/a\\u003e the best case scenario we have now would be of \\u003cstrong\\u003e12columns/256bit-num operation\\u003c/strong\\u003e with a feasible-to-build SRS size.\\u003c/p\\u003e\\n\\u003cp\\u003eNote that if the lookup can’t be of 2^256 bit elements directly, we’re forced to have some sort of decompositions of the numbers we want to use. This means that we not only need the lookups but also some custom gate or similar thing to perform the decomposition into limbs of base 2^64.\\u003c/p\\u003e\\n\\u003cp\\u003eThere are two parts where this really concerns me:\\u003c/p\\u003e\\n\\u003col\\u003e\\n\\u003cli\\u003eEach new operation we want to support (Assume we have Addition and we want Multiplication for example) \\u003cstrong\\u003ewill require to add 4 more columns\\u003c/strong\\u003e with all of the 2^64 possible results of the limb permutation operations that would form the 2^256 possibilities.\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003eThis is quite bad and barely optimal. And not in regards proving time specially. But rather setup time. \\u003cstrong\\u003eWe need to compute 4 new commitments per operation we want to add support for.\\u003c/strong\\u003e That means 4 new MSMs and the argument required by the lookup too. And considering we are managing polynomials of 2^64 elements, this might not me a quick task. Even with GPU or similar stuff.\\u003c/p\\u003e\\n\\u003col start=\\\&quot;2\\\&quot;\\u003e\\n\\u003cli\\u003e\\n\\u003cstrong\\u003eWe still need the permutation argument and all the rest of stuff until we can’t lookup directly 2^256-bit numbers\\u003c/strong\\u003e. Mainly because there’s no way to compose/decompose the elements into 64-bit limbs unless we use custom gates. Which will then add more commitments. Which will already be extended due to the length of the tables and the Degree finally required by the circuit.\\u003c/li\\u003e\\n\\u003c/ol\\u003e\\n\\u003cp\\u003eThings I’d like to see/explore:\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eShouldn’t we be able to express all the possible 8-bit operations we need and then, operate with the byte representations of the Field Elements that we use? I know this sounds a bit crazy. But what if we could define our tables of all of the 8-bit operations and the necessary 16-bit columns that derive into 8-bit limb decomposition when needed?\\u003cbr\\u003e\\nSo for example, imagine we have a multiplication of 2 bytes. We could first define the columns for Inp1, Inp2  and 16-bit Out. Then, define a decomposition op which would give us the resulting 8-bit limb and the remainder which needs to be added to the other limb etc…\\u003cbr\\u003e\\nThis is something that came to my mind some times already, and that might be useless, but might also be another perspective to look at the problem from.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003e\\u003cstrong\\u003eCould we modelate lookup arguments as Bloom Filters\\u003c/strong\\u003e for example? Given an entry (x,y,z) for example where X,Y are inputs and Z an output, run through a high precision Bloom Filter to check that the relation is indeed one of the accepted ones.\\u003cbr\\u003e\\nThis is also, another idea that sometimes poped on my head. Again, could be completelly useless too. But I think that maybe, lookup singularity might arrive from a change of perspective over the problem, rather than minor optimizations over the previous protocol we had.\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\&quot;,\&quot;post_number\&quot;:6,\&quot;post_type\&quot;:1,\&quot;updated_at\&quot;:\&quot;2022-11-29T23:05:07.778Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:5,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:136,\&quot;reads\&quot;:42,\&quot;readers_count\&quot;:41,\&quot;score\&quot;:728.4,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:65,\&quot;topic_slug\&quot;:\&quot;lookup-singularity\&quot;,\&quot;display_username\&quot;:\&quot;Carlos Pérez\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;username\&quot;:\&quot;shumo\&quot;,\&quot;name\&quot;:\&quot;Shumo Chu\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/zkresear.ch/shumo/{size}/47_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[{\&quot;id\&quot;:2,\&quot;count\&quot;:3}],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:42,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false},{\&quot;id\&quot;:122,\&quot;name\&quot;:\&quot;Barry\&quot;,\&quot;username\&quot;:\&quot;barryWhiteHat\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/zkresear.ch/barrywhitehat/{size}/63_2.png\&quot;,\&quot;created_at\&quot;:\&quot;2022-12-12T17:46:21.306Z\&quot;,\&quot;cooked\&quot;:\&quot;\\u003cp\\u003eWe are definitely a ways away from the lookup singularity. One way to get there is to try and find a lookup argument which is better than linear setup time in the size of the table. Tho there might be an impossibility result here. Something about having to include information about every possible result of the computation.\\u003c/p\\u003e\\n\\u003cp\\u003eThe other way we can over come this is to think about how the elements of our table are very repeated. So we may be able to take advantage of this to build tables with better than linear setup time. For example\\u003c/p\\u003e\\n\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003ewe want to calculate the a xor b\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eassume a and b are 1 bit\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eOur table is\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cdiv class=\\\&quot;md-table\\\&quot;\\u003e\\n\\u003ctable\\u003e\\n\\u003cthead\\u003e\\n\\u003ctr\\u003e\\n\\u003cth\\u003eA\\u003c/th\\u003e\\n\\u003cth\\u003eB\\u003c/th\\u003e\\n\\u003cth\\u003eResult\\u003c/th\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/thead\\u003e\\n\\u003ctbody\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e0\\u003c/td\\u003e\\n\\u003ctd\\u003e0\\u003c/td\\u003e\\n\\u003ctd\\u003e0\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e1\\u003c/td\\u003e\\n\\u003ctd\\u003e0\\u003c/td\\u003e\\n\\u003ctd\\u003e1\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e0\\u003c/td\\u003e\\n\\u003ctd\\u003e1\\u003c/td\\u003e\\n\\u003ctd\\u003e1\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003ctr\\u003e\\n\\u003ctd\\u003e1\\u003c/td\\u003e\\n\\u003ctd\\u003e1\\u003c/td\\u003e\\n\\u003ctd\\u003e0\\u003c/td\\u003e\\n\\u003c/tr\\u003e\\n\\u003c/tbody\\u003e\\n\\u003c/table\\u003e\\n\\u003c/div\\u003e\\u003cul\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eNote that the result is commutative. Meaning if you switch A and B the result is the same\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eWe can leverage this if our lookup argument can check for A , B \\u003cem\\u003eAND\\u003c/em\\u003e B , A\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eThis also works for addition , multiplication and any other operation that is commutative\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003cli\\u003e\\n\\u003cp\\u003eThis should reduce our look table size by 1/2\\u003c/p\\u003e\\n\\u003c/li\\u003e\\n\\u003c/ul\\u003e\\n\\u003cp\\u003eSo its definitely possible to have a sub-linear setup time assuming we can make our lookup arguments allow for for this kind of AND behavior.\\u003c/p\\u003e\&quot;,\&quot;post_number\&quot;:7,\&quot;post_type\&quot;:1,\&quot;updated_at\&quot;:\&quot;2022-12-12T17:46:21.306Z\&quot;,\&quot;reply_count\&quot;:0,\&quot;reply_to_post_number\&quot;:5,\&quot;quote_count\&quot;:0,\&quot;incoming_link_count\&quot;:123,\&quot;reads\&quot;:35,\&quot;readers_count\&quot;:34,\&quot;score\&quot;:622.0,\&quot;yours\&quot;:false,\&quot;topic_id\&quot;:65,\&quot;topic_slug\&quot;:\&quot;lookup-singularity\&quot;,\&quot;display_username\&quot;:\&quot;Barry\&quot;,\&quot;primary_group_name\&quot;:null,\&quot;flair_name\&quot;:null,\&quot;flair_url\&quot;:null,\&quot;flair_bg_color\&quot;:null,\&quot;flair_color\&quot;:null,\&quot;version\&quot;:1,\&quot;can_edit\&quot;:false,\&quot;can_delete\&quot;:false,\&quot;can_recover\&quot;:false,\&quot;can_wiki\&quot;:false,\&quot;read\&quot;:true,\&quot;user_title\&quot;:null,\&quot;reply_to_user\&quot;:{\&quot;username\&quot;:\&quot;shumo\&quot;,\&quot;name\&quot;:\&quot;Shumo Chu\&quot;,\&quot;avatar_template\&quot;:\&quot;/user_avatar/zkresear.ch/shumo/{size}/47_2.png\&quot;},\&quot;bookmarked\&quot;:false,\&quot;actions_summary\&quot;:[],\&quot;moderator\&quot;:false,\&quot;admin\&quot;:false,\&quot;staff\&quot;:false,\&quot;user_id\&quot;:37,\&quot;hidden\&quot;:false,\&quot;trust_level\&quot;:1,\&quot;deleted_at\&quot;:null,\&quot;user_deleted\&quot;:false,\&quot;edit_reason\&quot;:null,\&quot;can_view_edit_history\&quot;:true,\&quot;wiki\&quot;:false}],\&quot;stream\&quot;:[91,99,102,106,114,115,122]},\&quot;timeline_lookup\&quot;:[[1,1376],[2,1375],[4,1374],[5,1371],[6,1370],[7,1357]],\&quot;suggested_topics\&quot;:[],\&quot;tags\&quot;:[],\&quot;tags_descriptions\&quot;:{},\&quot;id\&quot;:65,\&quot;title\&quot;:\&quot;Lookup Singularity\&quot;,\&quot;fancy_title\&quot;:\&quot;Lookup Singularity\&quot;,\&quot;posts_count\&quot;:7,\&quot;created_at\&quot;:\&quot;2022-11-23T22:46:54.764Z\&quot;,\&quot;views\&quot;:11140,\&quot;reply_count\&q     </h1>

        <div class='post' itemprop='articleBody'>
          <p>Thanks <a href="https://github.com/ChihChengLiang" rel="noopener nofollow ugc">CC</a> for review and feedback <img src="https://zkresear.ch/images/emoji/twitter/slight_smile.png?v=12" title=":slight_smile:" class="emoji" alt=":slight_smile:" loading="lazy" width="20" height="20"></p>
<h2>
<a name="intro-1" class="anchor" href="#intro-1"></a>Intro</h2>
<p>For years the central component of ZKPs was <span class="math">A* B + D == C</span>. This check was applied repeatedly to build our full circuits. Any computation can be represented in this way. This representation is called R1CS.</p>
<p>It turns out R1CS is prohibitively expensive for certain tasks. This led to increased use of lookup arguments. Currently we use lookups and a variant of R1CS called polynomial constraints to build our circuits.</p>
<p>A lot of things are blocked if we want to build them using only r1cs. So the general flow is that some clever people get together and find efficient ways to arithmetise circuits. They create hand tuned circuits that include both polynomial constraints and lookup arguments. This is circuit specific and is not very scalable.</p>
<h2>
<a name="polynomial-constraints-2" class="anchor" href="#polynomial-constraints-2"></a>Polynomial constraints</h2>
<p>Polynomial constraints are complicated. The circuit implementer makes many of these polynomial equations. The whole circuit is defined as a system of polynomial equations.<br>
A solution to this system of equations makes a valid proof. It’s hard to reason about the results of systems of equations.<br>
Formal verification tools cannot , at the moment, solve polynomial equations in a prime field.</p>
<h2>
<a name="lookup-arguments-3" class="anchor" href="#lookup-arguments-3"></a>Lookup arguments</h2>
<p>Lookup arguments are set membership checks. They were first used to do efficient big integer arithmetic. Now used for that but also as control flow for VMs and to do operations that are not snark friendly. They are not more efficient for all operations. The cost per lookup introduces some prover cost. We currently try and use lookup arguments rarely because they are expensive in the prover</p>
<h2>
<a name="why-lookup-arguments-are-good-4" class="anchor" href="#why-lookup-arguments-are-good-4"></a>Why lookup arguments are good</h2>
<h3>
<a name="language-5" class="anchor" href="#language-5"></a>Language</h3>
<p>Currently snark friendly languages are very difficult for new programmers to learn. They use prime fields and polynomial constraints which are not a paradigm they are used to.  A language that only uses lookup arguments could be much simpler. Current languages are good at doing computation that is specific to snarks but doing traditional computation is much more expensive. A lookup only language would be better on both counts.</p>
<h3>
<a name="security-review-6" class="anchor" href="#security-review-6"></a>Security review</h3>
<p>Auditors are not used to finding solutions to a series of polynomial equations. Lookup arguments are much simpler to reason about.</p>
<h4>
<a name="example-7" class="anchor" href="#example-7"></a>Example:</h4>
<p>Take a circuit is an AND of two input variables, the output is the result.</p>
<h5>
<a name="lookup-approach-8" class="anchor" href="#lookup-approach-8"></a>Lookup approach</h5>
<pre><code class="lang-auto">out = get x,y from AND table
return(out)
</code></pre>
<p>The above lookup approach is much simpler than the polynomial approach shown next.</p>
<h5>
<a name="polynomial-approach-9" class="anchor" href="#polynomial-approach-9"></a>polynomial approach</h5>
<pre><code class="lang-auto">(x)(x-1) = 0 
y(y-1) = 0 
x*y = out
return(out)
</code></pre>
<p>It is likely going to be much simpler to find bugs in lookup only circuits.</p>
<h3>
<a name="formal-verification-10" class="anchor" href="#formal-verification-10"></a>Formal verification</h3>
<p>Formal verification tools need to solve the series of polynomial equations. Tools that solve these systems do not work well over prime fields. This leads to a lot of extra work being required to make a solver that works over a field. Using only lookup arguments would allow us to use already existing tools. It would also open up other methods for us to explore. Lookup arguments limit the set of valid variables at any point in the circuit. So we go from the set of possible variables being <span class="math">2^{254}</span> to being <span class="math">2</span> or <span class="math">2^{16}</span>. This could even allow us to do things like state space enumeration to confirm our circuit is correct.</p>
<h2>
<a name="information-theory-comparison-11" class="anchor" href="#information-theory-comparison-11"></a>Information theory comparison</h2>
<p>In order to effectively describe our program as a circuit we need to make a circuit that maps an input to the correct output. We can look at circuits as information encoded per second of prover time. This seems like a good way to compare the different ways we have of implementing circuits.</p>
<p>Polynomial constraints have limited degree. This is because the degree affects the prover time. The degree limits the information you can encode with them. You can make a polynomial that is degree 5 that can map 5 input values to 5 output values. You can’t include more values in the polynomial unless you increase the degree. In many cases this is fine because we use the structure of the polynomial constraint to do calculations. So multiplication is defined by a polynomial operation <span class="math">A * B == C</span> but XOR is not and needs to be encoded as keys to values.</p>
<p>Lookup arguments can contain much more information. We have previously been limited in table size of <span class="math">2^{28}</span> elements. But recent work makes the limit of circuit size the maximum trusted setup you can feasibly complete.  This limit on the <span class="math">table\_size</span>. <a href="https://eprint.iacr.org/2022/1565" class="inline-onebox" rel="noopener nofollow ugc">Baloo: Nearly Optimal Lookup Arguments</a>. A single polynomial constraint can contain ~ <span class="math">5 *2^{254}</span>  bits of information. Lookup arguments can contain <span class="math">2^{254} * table\_size</span> bits of information.</p>
<p>Polynomial constraints are very useful where you use the structure of the polynomial constraint. But as tables of bigger size become feasible this advantage will disappear.</p>
<h2>
<a name="conclusions-12" class="anchor" href="#conclusions-12"></a>Conclusions</h2>
<p>If we can efficiently define circuits using lookup arguments only it will lead to simpler tooling and circuits.</p>
<p>Lookup arguments will become more efficient than polynomial constraints for almost everything with time.</p>
<p>We should start building the tooling for a lookup centric zkps</p>
<h2>
<a name="future-work-13" class="anchor" href="#future-work-13"></a>Future work</h2>
<ul>
<li>
<p>Compare efficiency of circuits right now.</p>
</li>
<li>
<p>Example lookup only language</p>
</li>
<li>
<p>Do a comparison of relative efficiency of various lookup arguments. Try and estimate the pace of improvements</p>
</li>
<li>
<p>Find examples where lookup arguments are better and worse than polynomial constraints</p>
<ul>
<li>Find the worst case examples for both</li>
<li>Benchmark many circuits using: lookup arguments, lookup + polynomial constraints and compare them for efficiency</li>
</ul>
</li>
</ul>

        <div class='post' itemprop='articleBody'>
          <p>Great post, thanks for sharing! Another interesting idea of similar flavor is to consider recursion protocols as a primitive for cheap structured operations. In particular, with folding scheme based constructions like <a href="https://github.com/microsoft/Nova" rel="noopener nofollow ugc">Nova</a> (that work directly on the level of constraint IOPs), we could witness repeated operations and prove them within a larger SNARK seperately.</p>
<p>For instance, building on your example, suppose we have a large circuit with N AND operations mapping two M bit inputs to one M bit output. Then, we could first extract these N operations from the witness and seperately write a recursive circuit of N steps (verifying one M bit AND op at each step) in Nova, and generate as output a Nova (relaxed R1CS) instance with O(M) constraints + O(1) recursion overhead constraints (~10k or so in case of Nova). Therefore, the prover would do O(N) work outside the main proof (notably the dominating cost is from O(N) MSMs) + O(1) extra checks in their primary circuit, matching the optimal lookup table arguments runtime.</p>
<p>In this setup, we don’t exactly get all the described benefits of security/simplicity lookups have, but it’s not bounded on trusted setup size (as yet?) and efficient implementations of folding schemes like Nova already exist. It would be interesting to try comparing these ideas and benchmarking concrete numbers!</p>
<p><a class="mention" href="/u/therealyingtong">@therealyingtong</a> also noted that similar approaches are used in the ZK EVM circuits (for hashing, for instance)</p>

          <p><div class="lightbox-wrapper"><a class="lightbox" href="https://zkresear.ch/uploads/default/original/1X/6c65464f7fa98cdb7008cd05050c4b6be051347f.png" data-download-href="https://zkresear.ch/uploads/default/6c65464f7fa98cdb7008cd05050c4b6be051347f" title="Screenshot 2022-11-24 at 1.59.55 PM"><img src="https://zkresear.ch/uploads/default/optimized/1X/6c65464f7fa98cdb7008cd05050c4b6be051347f_2_690x337.png" alt="Screenshot 2022-11-24 at 1.59.55 PM" data-base62-sha1="fsUxTH1AqVUHzyMxc3MxLWRSLBJ" width="690" height="337" srcset="https://zkresear.ch/uploads/default/optimized/1X/6c65464f7fa98cdb7008cd05050c4b6be051347f_2_690x337.png, https://zkresear.ch/uploads/default/optimized/1X/6c65464f7fa98cdb7008cd05050c4b6be051347f_2_1035x505.png 1.5x, https://zkresear.ch/uploads/default/original/1X/6c65464f7fa98cdb7008cd05050c4b6be051347f.png 2x" data-dominant-color="19191A"><div class="meta">
<svg class="fa d-icon d-icon-far-image svg-icon" aria-hidden="true"><use href="#far-image"></use></svg><span class="filename">Screenshot 2022-11-24 at 1.59.55 PM</span><span class="informations">1186×580 98.7 KB</span><svg class="fa d-icon d-icon-discourse-expand svg-icon" aria-hidden="true"><use href="#discourse-expand"></use></svg>
</div></a></div></p>
<p>As Ariel nicely articulated above, I think a hybrid approach makes a lot of sense. One of my biggest pain point of writing Circom today is having to using things like this (don’t know how to call this, Groth16 arithmetization?) as a “poor man’s” lookup table:</p>

        <div class='post' itemprop='articleBody'>
          <p>I think Ariel is assuming you can’t make a table iwth more than 2**128 elements I think if we can do that then we can do better than native adds and muls especially if you are doing wrong field stuff.</p>
<p>I agree that we need to be able to make very big tables.</p>

      <div id='post_5' itemscope itemtype='http://schema.org/DiscussionForumPosting' class='topic-body crawler-post'>
        <div class='crawler-post-meta'>
          <div itemprop='publisher' itemscope itemtype="http://schema.org/Organization">
            <meta itemprop='name' content='zk research'>
              <div itemprop='logo' itemscope itemtype="http://schema.org/ImageObject">
                <meta itemprop='url' content='https://zkresear.ch/uploads/default/original/1X/9378ad55aa514fd61b0b84d4907d4585105cebda.png'>
              </div>
          </div>
          <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
            <a itemprop="url" href='https://zkresear.ch/u/shumo'><span itemprop='name'>shumo</span></a>
            
          </span>

          <link itemprop="mainEntityOfPage" href="https://zkresear.ch/t/lookup-singularity/65">


          <span class="crawler-post-infos">
              <time itemprop='datePublished' datetime='2022-11-28T19:26:53Z' class='post-time'>
                November 28, 2022,  7:26pm
              </time>
              <meta itemprop='dateModified' content='2022-11-28T20:39:38Z'>
          <span itemprop='position'>#5</span>
          </span>
        </div>
        <div class='post' itemprop='articleBody'>
          <p>The prover work of newer constructions like Baloo is quasi-linear to size<br>
of the set to be opened (rather than the entire table), which is very nice. However, these works still require a linear or quasi-linear setup time with regards to the actual size of the lookup table. Do you think this is an inherent limitation? If so, would that imply making a 2^128 sized lookup table would still be quite prohibitive? (I don’t know what is the real practical size to be, but I would guess something like 2^60 ish).</p>
        </div>

        <meta itemprop='headline' content='Lookup Singularity'>

        <div itemprop="interactionStatistic" itemscope itemtype="http://schema.org/InteractionCounter">

      <div id='post_6' itemscope itemtype='http://schema.org/DiscussionForumPosting' class='topic-body crawler-post'>
        <div class='crawler-post-meta'>
          <div itemprop='publisher' itemscope itemtype="http://schema.org/Organization">
            <meta itemprop='name' content='zk research'>
              <div itemprop='logo' itemscope itemtype="http://schema.org/ImageObject">
                <meta itemprop='url' content='https://zkresear.ch/uploads/default/original/1X/9378ad55aa514fd61b0b84d4907d4585105cebda.png'>
              </div>
          </div>
          <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
            <a itemprop="url" href='https://zkresear.ch/u/CPerezz'><span itemprop='name'>CPerezz</span></a>
            
          </span>

          <link itemprop="mainEntityOfPage" href="https://zkresear.ch/t/lookup-singularity/65">


          <span class="crawler-post-infos">
              <time itemprop='datePublished' datetime='2022-11-29T23:05:07Z' class='post-time'>
                November 29, 2022, 11:05pm
              </time>
              <meta itemprop='dateModified' content='2022-11-29T23:05:07Z'>
          <span itemprop='position'>#6</span>
          </span>
        </div>
        <div class='post' itemprop='articleBody'>
          <p>I guess then that with schemes like Baloo, we could get slightly closer the lookup-singularity by increasing the ratio bits/lookup with slightly better pre-processing times and, for sure, much better proving times. But not sure if it gives enough positive expectations for the lookup singularity future. Let me elaborate:</p>
<p>Theoretically, with 4 columns of 2^64 elements each, we should be able to express any 2^256 element. This means that we need 8 columns to represent 2 2^256-elements and 12 columns to represent any operation between them that gives as a result another 2^256 element.</p>
<p>This will look like:</p>
<div class="md-table">
<table>
<thead>
<tr>
<th>E64</th>
<th>E128</th>
<th>E192</th>
<th>E256</th>
<th>F64</th>
<th>F128</th>
<th>F192</th>
<th>F256</th>
<th>R64</th>
<th>R128</th>
<th>R192</th>
<th>R256</th>
</tr>
</thead>
<tbody>
<tr>
<td>X1</td>
<td>X2</td>
<td>X3</td>
<td>X4</td>
<td>Y1</td>
<td>Y2</td>
<td>Y3</td>
<td>Y4</td>
<td>Z1</td>
<td>Z2</td>
<td>Z3</td>
<td>Z4</td>
</tr>
<tr>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
<td>…</td>
</tr>
<tr>
<td>XN_1</td>
<td>XN_2</td>
<td>XN_3</td>
<td>XN_4</td>
<td>YN_1</td>
<td>YN_2</td>
<td>YN_3</td>
<td>YN_4</td>
<td>ZN_1</td>
<td>ZN_2</td>
<td>ZN_3</td>
<td>ZN_4</td>
</tr>
</tbody>
</table>
</div><p>Assuming this, we see that the ratio with tables of 2^64 bit elements for an addition, mul, XOR or any <code>F(x,y)-&gt;z</code> is of <strong>12columns/256bit-num operation</strong>. So according to <a class="mention" href="/u/shumo">@shumo</a> the best case scenario we have now would be of <strong>12columns/256bit-num operation</strong> with a feasible-to-build SRS size.</p>
<p>Note that if the lookup can’t be of 2^256 bit elements directly, we’re forced to have some sort of decompositions of the numbers we want to use. This means that we not only need the lookups but also some custom gate or similar thing to perform the decomposition into limbs of base 2^64.</p>
<p>There are two parts where this really concerns me:</p>
<ol>
<li>Each new operation we want to support (Assume we have Addition and we want Multiplication for example) <strong>will require to add 4 more columns</strong> with all of the 2^64 possible results of the limb permutation operations that would form the 2^256 possibilities.</li>
</ol>
<p>This is quite bad and barely optimal. And not in regards proving time specially. But rather setup time. <strong>We need to compute 4 new commitments per operation we want to add support for.</strong> That means 4 new MSMs and the argument required by the lookup too. And considering we are managing polynomials of 2^64 elements, this might not me a quick task. Even with GPU or similar stuff.</p>
<ol start="2">
<li>
<strong>We still need the permutation argument and all the rest of stuff until we can’t lookup directly 2^256-bit numbers</strong>. Mainly because there’s no way to compose/decompose the elements into 64-bit limbs unless we use custom gates. Which will then add more commitments. Which will already be extended due to the length of the tables and the Degree finally required by the circuit.</li>
</ol>
<p>Things I’d like to see/explore:</p>
<ul>
<li>
<p>Shouldn’t we be able to express all the possible 8-bit operations we need and then, operate with the byte representations of the Field Elements that we use? I know this sounds a bit crazy. But what if we could define our tables of all of the 8-bit operations and the necessary 16-bit columns that derive into 8-bit limb decomposition when needed?<br>
So for example, imagine we have a multiplication of 2 bytes. We could first define the columns for Inp1, Inp2  and 16-bit Out. Then, define a decomposition op which would give us the resulting 8-bit limb and the remainder which needs to be added to the other limb etc…<br>
This is something that came to my mind some times already, and that might be useless, but might also be another perspective to look at the problem from.</p>
</li>
<li>
<p><strong>Could we modelate lookup arguments as Bloom Filters</strong> for example? Given an entry (x,y,z) for example where X,Y are inputs and Z an output, run through a high precision Bloom Filter to check that the relation is indeed one of the accepted ones.<br>
This is also, another idea that sometimes poped on my head. Again, could be completelly useless too. But I think that maybe, lookup singularity might arrive from a change of perspective over the problem, rather than minor optimizations over the previous protocol we had.</p>
</li>
</ul>
        </div>

      <div id='post_7' itemscope itemtype='http://schema.org/DiscussionForumPosting' class='topic-body crawler-post'>
        <div class='crawler-post-meta'>
          <div itemprop='publisher' itemscope itemtype="http://schema.org/Organization">
            <meta itemprop='name' content='zk research'>
              <div itemprop='logo' itemscope itemtype="http://schema.org/ImageObject">
                <meta itemprop='url' content='https://zkresear.ch/uploads/default/original/1X/9378ad55aa514fd61b0b84d4907d4585105cebda.png'>
              </div>
          </div>
          <span class="creator" itemprop="author" itemscope itemtype="http://schema.org/Person">
            <a itemprop="url" href='https://zkresear.ch/u/barryWhiteHat'><span itemprop='name'>barryWhiteHat</span></a>
            
          </span>

          <link itemprop="mainEntityOfPage" href="https://zkresear.ch/t/lookup-singularity/65">


          <span class="crawler-post-infos">
              <time itemprop='datePublished' datetime='2022-12-12T17:46:21Z' class='post-time'>
                December 12, 2022,  5:46pm
              </time>
              <meta itemprop='dateModified' content='2022-12-12T17:46:21Z'>
          <span itemprop='position'>#7</span>
          </span>
        </div>
        <div class='post' itemprop='articleBody'>
          <p>We are definitely a ways away from the lookup singularity. One way to get there is to try and find a lookup argument which is better than linear setup time in the size of the table. Tho there might be an impossibility result here. Something about having to include information about every possible result of the computation.</p>
<p>The other way we can over come this is to think about how the elements of our table are very repeated. So we may be able to take advantage of this to build tables with better than linear setup time. For example</p>
<ul>
<li>
<p>we want to calculate the a xor b</p>
</li>
<li>
<p>assume a and b are 1 bit</p>
</li>
<li>
<p>Our table is</p>
</li>
</ul>
<div class="md-table">
<table>
<thead>
<tr>
<th>A</th>
<th>B</th>
<th>Result</th>
</tr>
</thead>
<tbody>
<tr>
<td>0</td>
<td>0</td>
<td>0</td>
</tr>
<tr>
<td>1</td>
<td>0</td>
<td>1</td>
</tr>
<tr>
<td>0</td>
<td>1</td>
<td>1</td>
</tr>
<tr>
<td>1</td>
<td>1</td>
<td>0</td>
</tr>
</tbody>
</table>
</div><ul>
<li>
<p>Note that the result is commutative. Meaning if you switch A and B the result is the same</p>
</li>
<li>
<p>We can leverage this if our lookup argument can check for A , B <em>AND</em> B , A</p>
</li>
<li>
<p>This also works for addition , multiplication and any other operation that is commutative</p>
</li>
<li>
<p>This should reduce our look table size by 1/2</p>
</li>
</ul>
<p>So its definitely possible to have a sub-linear setup time assuming we can make our lookup arguments allow for for this kind of AND behavior.</p>
        </div>
